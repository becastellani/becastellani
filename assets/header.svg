<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bernardo Castellani — Software Engineer">
  <style>
    :root {
      --bg: #f6f8fa;
      --grid: #d0d7de;
      --fg: #1f2328;
      --muted: #59636e;
      --accent: #0969da;
      --accent2: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --grid: #21262d;
        --fg: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #3fb950;
      }
    }
    .bg { fill: var(--bg); }
    .grid line { stroke: var(--grid); stroke-width: 1; }
    .name { fill: var(--fg); font: 700 64px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .role { fill: var(--accent); font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tag  { fill: var(--muted); font: 400 20px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .prompt { fill: var(--accent2); font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cursor { fill: var(--accent); animation: blink 1.1s steps(1) infinite; }
    .node { fill: var(--accent); opacity: .85; }
    .edge { stroke: var(--accent); stroke-width: 1.5; opacity: .35; }
    .pulse { fill: var(--accent2); animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
  </style>

  <rect class="bg" width="1200" height="300" rx="16"/>

  <g class="grid">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="840" y1="0" x2="840" y2="300"/>
    <line x1="960" y1="0" x2="960" y2="300"/>
    <line x1="1080" y1="0" x2="1080" y2="300"/>
  </g>

  <!-- small service graph: microservices / queues -->
  <g>
    <line class="edge" x1="900" y1="90"  x2="1020" y2="150"/>
    <line class="edge" x1="900" y1="210" x2="1020" y2="150"/>
    <line class="edge" x1="1020" y1="150" x2="1130" y2="90"/>
    <line class="edge" x1="1020" y1="150" x2="1130" y2="210"/>
    <circle class="node" cx="900"  cy="90"  r="9"/>
    <circle class="node" cx="900"  cy="210" r="9"/>
    <circle class="node" cx="1130" cy="90"  r="9"/>
    <circle class="node" cx="1130" cy="210" r="9"/>
    <circle class="pulse" cx="1020" cy="150" r="14"/>
  </g>

  <text class="prompt" x="64" y="86">~/becastellani $</text>
  <text class="role" x="282" y="86">whoami</text>
  <rect class="cursor" x="368" y="68" width="12" height="22"/>

  <text class="name" x="60" y="160">Bernardo Castellani</text>
  <text class="role" x="64" y="204">Software Engineer · Backend · AI</text>
  <text class="tag"  x="64" y="244">Architecture that survives production.</text>
</svg>
